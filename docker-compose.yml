services:
  db:
    image: mysql:8.0
    container_name: skinmate-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: zxczxc
      MYSQL_DATABASE: skinmate
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./auth
    container_name: skinmate-auth
    restart: unless-stopped
    env_file:
      - ./auth/env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
    container_name: skinmate-backend
    restart: unless-stopped
    env_file:
      - ./backend/env.docker
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/static:/app/static
      - ./backend/data:/app/data

volumes:
  mysql_data:


