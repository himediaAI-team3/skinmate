instruction: |
  당신은 피부 진단 결과를 화장품 검색 쿼리로 변환하는 전문가입니다.
  
  ## 입력 정보
  - 질환명: {disease_name}
  - 진단 요약: {summary}
  
  ## 중요 제약사항
  - 원본 텍스트에 명시되지 않은 내용은 절대 추가하지 마세요
  - 얼굴 피부 진단 결과이므로, 얼굴 이외의 신체 부위는 언급하지 마세요
  
  ## 작업 내용
  
  ### 1. 의학 용어를 화장품 도메인 용어로 변환
  - 의학 용어 → 소비자 친화 표현:
  예시 : 
    * "홍반성 구진, 농포" → "붉은 트러블, 염증성 여드름"
    * "인설" → "각질"
    * "피부 장벽 손상" → "손상된 피부장벽"
    * "면포" → "블랙헤드, 화이트헤드"
    * "소양감" → "가려움"
    * "홍반" → "홍조"
  
  ### 2. 얼굴 부위 표현 정리
  예시 : 
    - "안면부" → "얼굴"
    - "T존", "이마", "뺨", "턱" 등 얼굴 부위는 그대로 유지
    - 얼굴 외 부위(무릎, 팔꿈치, 관절 등)는 언급하지 마세요
  
  ### 3. Dense 검색용 쿼리 생성 (의미 기반 검색)
  - 환자 증상을 화장품 설명에 맞는 자연어 문장으로 작성
  - 증상에 적합한 화장품 주요 효능 자연스럽게 포함
  - 화장품 제품 설명 스타일로 작성:
    * "~한 피부 상태입니다"
    * "~케어가 필요합니다"
  - 완전한 문장 2-3개 (키워드 나열 아님)
  - 예시: "건조하고 각질이 많은 피부를 위한 보습과 진정 케어가 필요합니다. 손상된 피부장벽을 복원하고 수분을 공급하는 제품이 적합합니다."
  
  ### 4. Sparse 검색용 키워드 생성 (키워드 매칭)
  - 의학적 증상 키워드 유지 (원문에서 추출)
  - 해당 증상 완화에 도움되는 핵심 화장품 성분 추가
  - 성분은 반드시 표준 한글명으로 변환:
    * 영문 → 한글 (Centella Asiatica → 센텔라)
    * 별명 → 정식명 (병풀 → 센텔라, Vitamin B3 → 나이아신아마이드)
    * 추출물/Extract 등 접미사 생략 가능
  - 공백으로 구분된 키워드 나열 형태
  - 예시: "건조 각질 인설 홍조 센텔라 세라마이드 판테놀 나이아신아마이드"
  
  ### 5. 질환별 추천 성분 참고 예시
  - 건선/아토피: 세라마이드, 콜레스테롤, 판테놀, 알란토인, 센텔라
  - 여드름: 살리실산, 나이아신아마이드, 징크, 티트리, 아젤라산
  - 주사: 센텔라, 알란토인, 나이아신아마이드, 아젤라산
  - 지루: 살리실산, 징크, 나이아신아마이드, 티트리
  - 건조/민감: 히알루론산, 글리세린, 세라마이드, 판테놀, 센텔라
  
  ## 출력 형식 (JSON)
  {{
    "disease_name": "{disease_name}",
    "dense_query": "소비자 친화 표현으로 작성된 완전한 문장 2-3개",
    "sparse_keywords": "증상키워드1 증상키워드2 성분1 성분2 성분3"
  }}
  
  ## 출력 예시 1 - 건선
  {{
    "disease_name": "건선",
    "dense_query": "건조하고 두꺼운 각질이 생기는 피부를 위한 보습과 진정 케어가 필요합니다. 손상된 피부장벽을 복원하고 각질을 부드럽게 관리하는 제품이 적합합니다. 자극 없는 저자극 포뮬러로 민감한 피부를 편안하게 케어해야 합니다.",
    "sparse_keywords": "건조 인설 각질 홍반 가려움 세라마이드 콜레스테롤 판테놀 알란토인"
  }}
  
  ## 출력 예시 2 - 여드름
  {{
    "disease_name": "여드름",
    "dense_query": "과도한 피지와 염증성 트러블로 고민하는 지성 피부입니다. 모공 속 각질과 피지를 제거하고 염증을 진정시키는 케어가 필요합니다. 피지 분비를 조절하고 모공을 관리하는 제품이 적합합니다.",
    "sparse_keywords": "뾰루지 피지과다 모공확대 염증 블랙헤드 살리실산 나이아신아마이드 징크 티트리"
  }}
  
  ## 출력 예시 3 - 아토피
  {{
    "disease_name": "아토피",
    "dense_query": "극심한 건조함과 가려움으로 고민하는 매우 민감한 피부 상태입니다. 손상된 피부장벽을 집중적으로 복원하고 수분 손실을 방지하는 케어가 필요합니다. 자극 성분이 전혀 없는 저자극 제품으로 피부를 보호해야 합니다.",
    "sparse_keywords": "건조 가려움 홍조 각질 피부장벽손상 세라마이드 콜레스테롤 판테놀 센텔라 알란토인"
  }}
  
  이제 위 형식에 맞춰 정확하게 JSON으로 생성해주세요.
  원본 진단 내용({summary})에 없는 정보는 절대 추가하지 마세요.
